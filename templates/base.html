<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSIS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="topbar">
  <div class="nav-shell">
    <a class="brand-wrap" href="{{ url_for('dashboard') if current_user else url_for('login') }}">
      <span class="brand-mark">FSIS</span>
    </a>

    {% if current_user %}
    <div class="nav-actions">
      <a class="nav-pill {% if request.path == '/dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Classifier</a>
      <a class="nav-pill {% if request.path == '/history' %}active{% endif %}" href="{{ url_for('history') }}">Query History</a>
      {% if current_user.is_admin %}
      <a class="nav-pill {% if request.path == '/admin' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}">Admin</a>
      {% endif %}
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
    {% endif %}
  </div>
</nav>
<main class="page-shell">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
