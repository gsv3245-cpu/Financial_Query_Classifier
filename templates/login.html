{% extends 'base.html' %}
{% block title %}Login · FSIS{% endblock %}
{% block content %}
<div class="auth-shell single-column-auth">
  <div class="auth-card card-panel mx-auto">
    <div class="card-body p-4 p-md-5">
      <div class="auth-heading">
        <p class="eyebrow">Welcome back</p>
        <h2>Sign in</h2>
      </div>
      <div id="alert" class="alert d-none"></div>
      <form id="loginForm">
        <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" id="email" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" id="password" required></div>
        <button class="btn-primary-fill w-100" type="submit">Login</button>
      </form>
      <p class="small text-center mt-4 mb-0 auth-switch">New customer? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alert');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: emailInput.value,
      password: passwordInput.value,
    }),
  });

  const data = await res.json();
  if (data.success) window.location.href = '/dashboard';
  else { alertBox.className='alert alert-danger'; alertBox.textContent=data.error; }
});
</script>
{% endblock %}
